# 自动UPnP服务配置文件

# 端口监听范围配置
port_range:
  start: 18000      # 起始端口
  end: 18002        # 结束端口
  step: 1          # 端口间隔

# UPnP配置
upnp:
  discovery_timeout: 10s    # 设备发现超时时间
  mapping_duration: 1h      # 端口映射持续时间，0表示永久
  retry_attempts: 3         # 重试次数
  retry_delay: 5s           # 重试延迟
  health_check_interval: 1m # 健康检查间隔
  max_fail_count: 3         # 最大失败次数
  keep_alive_interval: 2m   # 保活间隔

# NAT穿透配置
nat_traversal:
  enabled: true            # 是否启用NAT穿透功能
  stun_servers:
    - stun.ealine.cn:3478
    - stun.miwifi.com:3478
    - stun.chat.bilibili.com:3478
    - stun.hitv.com:3478
    - stun.cdnbye.com:3478

# 网络接口配置
network:
  preferred_interfaces: ["eth0", "wlan0"]  # 优先使用的网络接口
  exclude_interfaces: ["lo", "docker"]     # 排除的网络接口

# 日志配置
log:
  level: "debug"
  format: "json"
  file: "auto_upnp.log"
  max_size: 10485760  # 10MB
  backup_count: 5

# 监控配置
monitor:
  check_interval: 30s       # 端口状态检查间隔
  cleanup_interval: 5m      # 清理无效映射间隔

# 管理服务配置
admin:
  enabled: true             # 是否启用管理服务
  host: "0.0.0.0"          # 监听地址
  username: "admin"         # 用户名
  password: "admin"         # 密码 
  data_dir: "data"          # 数据目录